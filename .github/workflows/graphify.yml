name: Graphify knowledge graph

# Rebuilds graphify-out/ (graph.html, GRAPH_REPORT.md, graph.json) with the real graphify tool
# whenever the game changes. Code-only extraction runs offline: no API key needed.
on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/split_source.py', '.github/workflows/graphify.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install graphifyy

      - name: Split the single-file game into parseable sources
        run: python3 tools/split_source.py

      - name: Build the knowledge graph (code only, offline)
        working-directory: graph-src
        env:
          GRAPHIFY_BACKEND: none
        run: |
          graphify --help | head -40 || true
          graphify extract . --code-only
          graphify cluster-only . || true
          graphify export html || true
          ls -la graphify-out || true

      - name: Publish graph next to the game
        run: |
          rm -rf graphify-out
          cp -r graph-src/graphify-out graphify-out
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"
          git add -f graphify-out graph-src/game.js graph-src/style.css graph-src/layout.html
          git diff --cached --quiet || git commit -m "Update graphify knowledge graph [skip ci]"
          git push
